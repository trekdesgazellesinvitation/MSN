/* Layout: sidebar fixe + zone de travail ; tool utilitaire, densité info, accent pétrole sur neutres sable */
:root{
  --bg:#f4ede4; --surface:#ffffff; --surface-2:#faf5ee; --line:#e7ddcf;
  --fg:#23201b; --muted:#766f63; --faint:#9a9284;
  --accent:#6a2c8f; --accent-soft:#efe3f6; --accent-ink:#4a1f66;
  --ok:#2f7d4f; --ok-soft:#dcefe0; --warn:#9a6a12; --warn-soft:#fbeccb;
  --bad:#b23b36; --bad-soft:#f8dedc; --info:#2b5f9e; --info-soft:#dde8f7;
  --shadow:0 1px 2px rgba(40,34,24,.06),0 6px 20px rgba(40,34,24,.06);
  --r:12px; --r-sm:8px;
  --brand:#ad6f46; --brand-ink:#ffffff;
  --ui:'Coolvetica',system-ui,-apple-system,Segoe UI,sans-serif;
  --disp:'Coolvetica',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1814; --surface:#231f1a; --surface-2:#2a251f; --line:#39322a;
  --fg:#efe9df; --muted:#b2a894; --faint:#847b6c;
  --accent:#b98fd6; --accent-soft:#2c2036; --accent-ink:#e4d0f2;
  --ok:#6cc98a; --ok-soft:#1e3626; --warn:#d8a24e; --warn-soft:#3a2f15;
  --bad:#e78079; --bad-soft:#3a211f; --info:#7fb0e6; --info-soft:#1d2b3e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 22px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1a1814; --surface:#231f1a; --surface-2:#2a251f; --line:#39322a;
  --fg:#efe9df; --muted:#b2a894; --faint:#847b6c;
  --accent:#b98fd6; --accent-soft:#2c2036; --accent-ink:#e4d0f2;
  --ok:#6cc98a; --ok-soft:#1e3626; --warn:#d8a24e; --warn-soft:#3a2f15;
  --bad:#e78079; --bad-soft:#3a211f; --info:#7fb0e6; --info-soft:#1d2b3e;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 22px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance;font-family:var(--disp);letter-spacing:.2px}
.num{font-variant-numeric:tabular-nums}

#app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{padding:14px 16px;display:flex;align-items:center;justify-content:center;background:var(--brand);border-bottom:1px solid var(--line)}
.brandlogo{width:100%;max-width:190px;height:auto;display:block}
.brand .mark{width:40px;height:40px;border-radius:8px;overflow:hidden;background:var(--brand);flex:none}
.brand b{font-family:var(--disp);font-size:16px;font-weight:700;line-height:1;letter-spacing:.4px;color:var(--brand-ink);text-transform:uppercase}
.brand small{display:block;color:rgba(255,255,255,.82);font-size:11px;font-family:var(--ui)}
.nav{padding:10px 10px;display:flex;flex-direction:column;gap:2px;flex:1}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 11px;border-radius:var(--r-sm);color:var(--muted);cursor:pointer;font-size:13.5px}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav .ic{width:17px;height:17px;flex:none}
.nav .count{margin-left:auto;font-size:11px;background:var(--line);color:var(--muted);padding:1px 7px;border-radius:20px;font-variant-numeric:tabular-nums}
.side .foot{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.side .foot button{flex:1;border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-sm);padding:7px;color:var(--muted);cursor:pointer;font-size:12px}
.side .foot button:hover{color:var(--fg);border-color:var(--accent)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 22px;display:flex;align-items:center;gap:14px}
.topbar h1{font-size:19px}
.topbar .sub{color:var(--faint);font-size:12.5px;margin-top:1px}
.topbar .sp{flex:1}
.view{padding:22px;max-width:1180px;width:100%}

.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 13px;border-radius:var(--r-sm);cursor:pointer;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted);padding:6px 9px}
.btn.ghost:hover{background:var(--surface-2);color:var(--fg)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.ic{display:inline-block;vertical-align:middle}

.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow)}
.kpi .lab{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:25px;font-weight:700;margin-top:7px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.kpi .hint{font-size:11.5px;color:var(--faint);margin-top:3px}
.kpi.accent{background:linear-gradient(160deg,var(--accent) 0%,var(--accent-ink) 100%);border-color:transparent;color:#fff}
.kpi.accent .lab,.kpi.accent .hint{color:rgba(255,255,255,.82)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.panel .ph{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.panel .ph h2{font-size:14px}
.panel .ph .sp{flex:1}
.panel .pb{padding:4px 0}

table{width:100%;border-collapse:collapse}
thead th{text-align:left;font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--faint);font-weight:600;padding:9px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody td{padding:11px 16px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
td .t-main{font-weight:600}
td .t-sub{color:var(--faint);font-size:11.5px}
.right{text-align:right}
.tableWrap{overflow-x:auto}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.mute{background:var(--line);color:var(--muted)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.stars{color:var(--warn);font-size:11.5px;font-weight:700;letter-spacing:1px}

.empty{padding:38px 20px;text-align:center;color:var(--faint)}
.empty .ic{opacity:.5;margin-bottom:8px}
.seedline{font-size:11.5px;color:var(--warn);background:var(--warn-soft);padding:7px 14px;display:flex;gap:7px;align-items:center}

.ov{position:fixed;inset:0;background:rgba(20,16,10,.5);display:flex;align-items:flex-start;justify-content:center;padding:28px 16px;z-index:40;overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:640px;margin:auto}
.modal.wide{max-width:900px}
.mh{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h2{font-size:16px}
.mh .sp{flex:1}
.mb{padding:18px 20px;max-height:68vh;overflow:auto}
.mf{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-2)}
.mf .sp{flex:1}
.x{border:0;background:none;color:var(--muted);cursor:pointer;width:30px;height:30px;border-radius:7px;font-size:18px}
.x:hover{background:var(--surface-2)}

.field{margin-bottom:14px}
.field>label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
.field input,.field select,.field textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;font-size:13.5px}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent-soft);outline-offset:0;border-color:var(--accent)}
.field textarea{resize:vertical;min-height:62px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.row4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}

/* Devis sections editor */
.sec{border:1px solid var(--line);border-radius:var(--r-sm);margin-bottom:12px;overflow:hidden}
.sec-h{display:flex;align-items:center;gap:8px;background:var(--surface-2);padding:8px 10px}
.sec-h input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12.5px;font-weight:600}
.sec-h .st{font-size:12px;color:var(--ok);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.lwrap{overflow-x:auto}
.lh,.lr{display:grid;grid-template-columns:1.3fr 1fr 58px 48px 86px 86px 80px 26px;gap:7px;align-items:center;padding:6px 10px;min-width:720px}
.lh{font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--faint);font-weight:600;border-bottom:1px solid var(--line)}
.lr{border-bottom:1px solid var(--line)}
.lr:last-child{border-bottom:0}
.lr input,.lr select{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 6px;font-size:12px;width:100%}
.lr .ltot{font-size:12px;font-variant-numeric:tabular-nums;text-align:right;color:var(--muted)}
.lr .del{border:0;background:none;color:var(--faint);cursor:pointer;font-size:15px}
.lr .del:hover{color:var(--bad)}
.sec-f{padding:7px 10px;background:var(--surface-2)}
.devtot{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r-sm);padding:12px 14px;margin:12px 0;display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline;color:var(--accent-ink)}
.devtot .k{font-size:12px;opacity:.85}
.devtot b{font-variant-numeric:tabular-nums;font-size:14px}
.devtot .big{font-size:18px;font-weight:800}

.dl{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;font-size:13px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:500}
.sect-title{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--faint);font-weight:700;margin:18px 0 9px}
.secblock{margin-bottom:14px}
.secblock .sbh{display:flex;justify-content:space-between;align-items:baseline;background:var(--surface-2);padding:7px 12px;border-radius:7px 7px 0 0;border:1px solid var(--line);border-bottom:0}
.secblock .sbh b{font-size:12.5px}
.secblock .sbh .stot{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
.secblock table{border:1px solid var(--line);border-radius:0 0 7px 7px}
.secblock td{padding:7px 12px;font-size:12.5px}
.opt{opacity:.55}
.jours{display:flex;flex-direction:column;gap:8px}
.jour{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:var(--surface-2)}
.jour b{display:block;font-size:12.5px}
.jour span{color:var(--muted);font-size:12.5px}
.pay-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.pay-row:last-child{border-bottom:0}
.bar{height:7px;border-radius:20px;background:var(--line);overflow:hidden;margin-top:6px}
.bar>span{display:block;height:100%;background:var(--ok)}

.edcard{transition:transform .1s}.edcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.navmore{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;padding:9px 11px;border-radius:8px;color:var(--faint);cursor:pointer;font-size:12.5px;margin-top:6px;border-top:1px solid var(--line);padding-top:12px}
.navmore:hover{color:var(--fg)}
.homecta{margin-bottom:18px}
.bigcta{display:flex;flex-direction:column;align-items:flex-start;gap:3px;width:100%;background:linear-gradient(135deg,var(--accent),var(--accent-ink));color:#fff;border:0;border-radius:14px;padding:16px 18px;font-family:var(--disp);font-size:19px;font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
.bigcta small{font-family:var(--ui);font-size:12px;font-weight:400;opacity:.85}
.bigcta:hover{filter:brightness(1.04)}
.ctarow{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.wiz-steps{display:flex;gap:6px;margin-bottom:10px}
.wiz-steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.wiz-steps i.on{background:var(--accent)}
.wiz-opt{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--surface-2);font-size:13.5px}
.wiz-opt.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.wiz-opt input{width:auto;accent-color:var(--accent)}
.wiz-sum{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.wiz-big{font-family:var(--disp);font-size:22px;font-weight:800;color:var(--accent)}
.pdfov{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column}
.pdfbar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:var(--brand);color:#fff;font-size:13px}
.pdfbar span{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdfbar button{background:rgba(255,255,255,.22);border:0;color:#fff;padding:8px 13px;border-radius:8px;cursor:pointer;font-size:13px}
.pdfov iframe{flex:1;width:100%;border:0;background:#525659}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;z-index:60;box-shadow:var(--shadow);opacity:0;transition:opacity .2s}
.toast.show{opacity:1}

@media (max-width:760px){
  #app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:230px;z-index:30;transform:translateX(-100%);transition:transform .22s;height:100%}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none}
  .scrim.on{display:block}
  .menuBtn{display:inline-flex}
  .row3,.row4{grid-template-columns:1fr 1fr}
  .dl{grid-template-columns:1fr}
}
@media (min-width:761px){.menuBtn{display:none}}
</style>

const jMul=j=>(j===''||j==null)?1:(+j||0);
const lineTot=l=>l.statut==='Inclus'?(+l.qty||0)*jMul(l.jours)*(+l.unitaire||0):0;
function devisTot(d){let cout=0;(d.sections||[]).forEach(s=>s.lines.forEach(l=>cout+=lineTot(l)));const m=+d.marge||0;const marge=cout*m;const vente=cout+marge;return{cout,achat:cout,marge,vente,pct:Math.round(m*100),pax:+d.pax||0,paxPrice:(+d.pax)?vente/d.pax:0};}

const facPaye=f=>(f.paiements||[]).reduce((s,p)=>s+(+p.montant||0),0);
const facStatut=f=>{const p=facPaye(f);if(p<=0)return'Impayée';if(p<f.montant)return'Partielle';return'Payée';};

function vOperations(){const q=(window.OQ||'').trim().toLowerCase();let list=(DB.operations||[]).slice().sort((a,b)=>new Date(b.dateDebut)-new Date(a.dateDebut));if(q)list=list.filter(o=>[o.ref,o.titre,o.destination,o.type].join(' ').toLowerCase().includes(q));

function renderWizard(){const s=_wiz.step;let body='';
  if(s===1){body=`<div class="field"><label>Client existant</label><select id="w_client">${optClients(_wiz.clientId)}</select></div><div style="text-align:center;color:var(--faint);font-size:12px;margin:6px 0">— ou —</div><div class="field"><label>Nouveau client (nom)</label><input id="w_new" value="${esc(_wiz.newClient)}" placeholder="Ex : Sarah Mitchell"></div>`;}
  else if(s===2){const hotels=DB.fournisseurs.filter(f=>f.categorie==='Hôtel'||f.categorie==='Maison d’hôtes');body=`<div class="field"><label>Hôtel (tape pour chercher)</label><select id="w_hotel">${hotels.map(h=>`<option value="${h.id}" ${_wiz.hotelId===h.id?'selected':''}>${esc(h.nom)}${h.tarif?' — '+h.tarif+' MAD':''}</option>`).join('')}</select></div><div class="row3"><div class="field"><label>Nuits</label><input id="w_nuits" type="number" value="${_wiz.nuits}"></div><div class="field"><label>Pax</label><input id="w_pax" type="number" value="${_wiz.pax}"></div><div class="field"><label>Arrivée</label><input id="w_date" type="date" value="${_wiz.date}"></div></div><label style="font-size:12px;color:var(--muted);font-weight:600;display:block;margin-bottom:6px">Inclure dans le dossier</label>${[['transport','Transport (Berber Dreams Tours)'],['guide','Guide francophone'],['diner','Dîners'],['excursion','Excursion']].map(([k,l])=>`<label class="wiz-opt ${_wiz[k]?'sel':''}"><input type="checkbox" id="w_${k}" ${_wiz[k]?'checked':''} onchange="wsync();this.closest('.wiz-opt').classList.toggle('sel',this.checked)"> ${l}</label>`).join('')}`;}
  else{body=`<div class="field"><label>Marge commerciale %</label><input id="w_marge" type="number" value="${_wiz.marge}" oninput="wsync();document.getElementById('w_recap').innerHTML=wizRecap()"></div><div id="w_recap">${wizRecap()}</div><div style="color:var(--faint);font-size:12px;margin-top:10px">En validant : un devis + une réservation confirmée sont créés automatiquement.</div>`;}
  const nav=`<div class="mf"><div class="sp"></div>${s>1?`<button class="btn" onclick="wgo(${s-1})">Retour</button>`:''}${s<3?`<button class="btn primary" onclick="wgo(${s+1})">Suivant</button>`:`<button class="btn primary" onclick="wizCreate()">Créer le dossier</button>`}</div>`;
  modal(`<div class="modal"><div class="mh"><h2>Nouveau dossier</h2><div class="sp"></div><button class="x" onclick="closeModal()">×</button></div><div class="mb"><div class="wiz-steps"><i class="${s>=1?'on':''}"></i><i class="${s>=2?'on':''}"></i><i class="${s>=3?'on':''}"></i></div><div style="font-size:12px;color:var(--faint);margin-bottom:12px">Étape ${s}/3 — ${['Client','Séjour','Prix'][s-1]}</div>${body}</div>${nav}</div>`);}
function wizCreate(){wsync();let cid=_wiz.clientId;if(_wiz.newClient){cid=uid();DB.clients.push({id:cid,nom:_wiz.newClient,type:'Particulier',pays:'',email:'',tel:'',note:''});}if(!cid){toast('Choisis ou crée un client');return;}const h=fourn(_wiz.hotelId);const ch=Math.max(1,Math.ceil(_wiz.pax/2));const lines=[];if(h)lines.push({designation:'Hébergement — '+h.nom,fournisseurId:h.id,qty:ch,jours:_wiz.nuits,details:ch+' ch · '+_wiz.nuits+' nuits',statut:'Inclus',unitaire:h.tarif||1000});if(_wiz.transport)lines.push({designation:'Transport — Berber Dreams Tours',qty:1,jours:_wiz.nuits,details:'',statut:'Inclus',unitaire:2500});if(_wiz.guide)lines.push({designation:'Guide francophone',qty:1,jours:_wiz.nuits,details:'',statut:'Inclus',unitaire:1500});if(_wiz.diner)lines.push({designation:'Dîners',qty:_wiz.pax,jours:_wiz.nuits,details:'',statut:'Inclus',unitaire:300});if(_wiz.excursion)lines.push({designation:'Excursion',qty:_wiz.pax,jours:1,details:'',statut:'Inclus',unitaire:400});const dv={id:uid(),ref:nextRef('DEV',DB.devis),clientId:cid,date:today(),validite:'',devise:'MAD',statut:'Envoyé',pax:_wiz.pax,marge:_wiz.marge/100,note:'Dossier créé en mode simple',sections:[{titre:'Séjour',lines}]};DB.devis.push(dv);const t=devisTot(dv);const fin=new Date(new Date(_wiz.date).getTime()+_wiz.nuits*864e5).toISOString().slice(0,10);DB.reservations.push({id:uid(),ref:nextRef('RES',DB.reservations),devisId:dv.id,clientId:cid,dateDebut:_wiz.date,dateFin:fin,pax:_wiz.pax,statut:'Confirmé',montant:Math.round(t.vente),devise:'MAD',note:''});unseed();save();closeModal();VIEW='home';render();toast('Dossier créé ✓');setTimeout(()=>showDevis(dv.id),250);}
let EDSEL=null,EDQ='';
function edParts(eid){return (DB.participants||[]).filter(p=>p.editionId===eid);}
function edition(id){return (DB.editions||[]).find(e=>e.id===id);}
function edMoney(n){n=Math.round(n||0);var s=''+Math.abs(n),o='';for(var i=0;i<s.length;i++){if(i>0&&(s.length-i)%3===0)o+=' ';o+=s[i];}return (n<0?'-':'')+o+' MAD';}
function vEditions(){
  if(EDSEL)return vEditionDetail(EDSEL);
  const eds=(DB.editions||[]);
  const caTot=eds.reduce((s,e)=>s+edParts(e.id).length*e.prix,0);
  const paxTot=(DB.participants||[]).length;
  const cards=eds.map(e=>{const n=edParts(e.id).length;const ca=n*e.prix;const pct=e.capacite?Math.min(100,Math.round(n/e.capacite*100)):0;const full=e.capacite&&n>=e.capacite;
    return `<div class="panel edcard" onclick="EDSEL='${e.id}';render()" style="cursor:pointer">
      <div class="ph"><h2>${esc(e.nom)}</h2><div class="sp"></div>${e.capacite?`<span class="pill ${full?'ok':'warn'}">${n}/${e.capacite}</span>`:`<span class="pill mute">${n}</span>`}</div>
      <div style="padding:14px 16px">
        <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="color:var(--muted);font-size:12px">Prix / pers.</span><b class="num" style="font-size:17px">${e.prix?edMoney(e.prix):'—'}</b></div>
        ${e.capacite?`<div class="bar" style="margin-top:8px"><span style="width:${pct}%;background:${full?'var(--ok)':'var(--accent)'}"></span></div>`:''}
        <div style="display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)"><span style="color:var(--muted);font-size:12px">CA édition</span><b class="num" style="color:var(--accent)">${edMoney(ca)}</b></div>
      </div></div>`;}).join('');
  return `<div class="grid kpis" style="margin-bottom:16px">
      <div class="kpi accent"><div class="lab">CA potentiel total</div><div class="val">${edMoney(caTot)}</div><div class="hint">4 éditions / an</div></div>
      <div class="kpi"><div class="lab">Participants</div><div class="val num">${paxTot}</div><div class="hint">toutes éditions</div></div>
      <div class="kpi"><div class="lab">Éditions</div><div class="val num">${eds.filter(e=>e.capacite>0).length}</div><div class="hint">Mer · Désert · Atlas · Exclusive</div></div>
    </div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">${cards}</div>`;
}
function vEditionDetail(eid){
  const e=edition(eid);if(!e){EDSEL=null;return vEditions();}
  const q=EDQ.trim().toLowerCase();
  let list=edParts(eid);if(q)list=list.filter(p=>[p.nom,p.nat,p.tel,p.paiement,p.groupe].join(' ').toLowerCase().includes(q));
  const n=edParts(eid).length;const ca=n*e.prix;
  const rows=list.map(p=>`<tr onclick="editParticipant('${p.id}')"><td><span class="t-main">${esc(p.nom)}</span>${p.ref?`<div class="t-sub">#${esc(p.ref)}</div>`:''}</td><td>${esc(p.nat||'')}</td><td class="t-sub">${esc(p.tel||'')}</td>${e.prix?`<td>${p.paiement?`<span class="pill ${p.paiement==='Virement'?'info':'ok'}">${esc(p.paiement)}</span>`:'<span class="pill warn">—</span>'}</td>`:`<td>${p.groupe?('Groupe '+esc(p.groupe)):''}${p.creneau?`<div class="t-sub">${esc(p.creneau)}</div>`:''}</td>`}</tr>`).join('');
  return `<div style="margin-bottom:14px"><button class="btn ghost" onclick="EDSEL=null;EDQ='';render()">← Toutes les éditions</button></div>
    <div class="panel" style="margin-bottom:14px"><div style="padding:16px;display:flex;flex-wrap:wrap;gap:16px;align-items:center">
      <div><div style="font-family:var(--disp);font-size:20px;font-weight:700">Édition ${esc(e.nom)}</div><div class="t-sub">${n}${e.capacite?'/'+e.capacite:''} participant(s)</div></div>
      <div class="sp"></div>
      <div style="text-align:right"><div style="color:var(--muted);font-size:12px">Prix / pers.</div><div style="display:flex;align-items:center;gap:8px"><input id="ed_prix" type="number" value="${e.prix}" style="width:120px;text-align:right;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:15px;font-weight:700"><button class="btn primary sm" onclick="saveEdPrix('${e.id}')">Appliquer</button></div></div>
      <div style="text-align:right"><div style="color:var(--muted);font-size:12px">CA édition</div><div class="num" style="font-size:20px;font-weight:800;color:var(--accent)">${edMoney(ca)}</div></div>
    </div></div>
    <div class="panel" style="margin-bottom:12px"><div style="padding:10px 12px;display:flex;gap:10px;flex-wrap:wrap">
      <input id="edq" value="${esc(EDQ)}" oninput="EDQ=this.value;render();var el=document.getElementById('edq');if(el){el.focus();try{el.setSelectionRange(el.value.length,el.value.length)}catch(x){}}" placeholder="Rechercher un participant, nationalité, téléphone…" style="flex:1;min-width:180px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px">
      <button class="btn" onclick="editParticipant('')">+ Participant</button>
    </div></div>
    <div class="panel"><div class="pb"><div class="tableWrap"><table><thead><tr><th>Nom</th><th>Nationalité</th><th>Téléphone</th><th>${e.prix?'Paiement':'Groupe / créneau'}</th></tr></thead><tbody>${rows||`<tr><td colspan="4" class="empty" style="cursor:default">Aucun participant.</td></tr>`}</tbody></table></div></div></div>`;
}
function saveEdPrix(id){const e=edition(id);const v=+val('ed_prix');if(v<0||isNaN(v))return toast('Prix invalide');e.prix=v;unseed();save();render();toast('Prix mis à jour — CA recalculé');}
function editParticipant(id){const edit=!!id;const p=edit?(DB.participants||[]).find(x=>x.id===id):{editionId:EDSEL};const e=edition(p.editionId)||{};
  modal(formShell(edit?'Modifier le participant':'Nouveau participant',`
    <div class="field"><label>Nom *</label><input id="p_nom" value="${esc(p.nom||'')}"></div>
    <div class="field"><label>Édition</label><select id="p_ed">${(DB.editions||[]).map(x=>`<option value="${x.id}" ${p.editionId===x.id?'selected':''}>${esc(x.nom)}</option>`).join('')}</select></div>
    <div class="row2"><div class="field"><label>Nationalité</label><input id="p_nat" value="${esc(p.nat||'')}"></div><div class="field"><label>Téléphone</label><input id="p_tel" value="${esc(p.tel||'')}"></div></div>
    <div class="row2"><div class="field"><label>Paiement</label><select id="p_pay"><option value="">—</option>${['Virement','TPE','Espèces','En attente'].map(s=>`<option ${p.paiement===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Groupe</label><input id="p_grp" value="${esc(p.groupe||'')}"></div></div>
    <div class="field"><label>Créneau d’arrivée</label><input id="p_cre" value="${esc(p.creneau||'')}" placeholder="19:30 – 20:00"></div>`,
    `saveParticipant('${id||''}')`,edit?`delParticipant('${id}')`:''));}
function saveParticipant(id){const nom=val('p_nom');if(!nom)return toast('Nom requis');const obj={nom,editionId:val('p_ed'),nat:val('p_nat'),tel:val('p_tel'),paiement:val('p_pay'),groupe:val('p_grp'),creneau:val('p_cre')};if(!DB.participants)DB.participants=[];if(id){const i=DB.participants.findIndex(x=>x.id===id);DB.participants[i]={...DB.participants[i],...obj};}else{DB.participants.push({id:uid(),ref:'',...obj});}unseed();save();closeModal();render();toast('Participant enregistré');}
function delParticipant(id){DB.participants=DB.participants.filter(x=>x.id!==id);save();closeModal();render();toast('Supprimé');}
function vSettings(){const s=DB.settings;return `<div class="panel" style="max-width:560px"><div class="ph"><h2>Configuration</h2></div><div style="padding:18px 20px">
  <div class="field"><label>Nom de l’agence</label><input id="set_agence" value="${esc(s.agence)}"></div>
  <div class="row2"><div class="field"><label>Ville</label><input id="set_ville" value="${esc(s.ville||'')}"></div><div class="field"><label>Devise principale</label><select id="set_devise">${['MAD','EUR','USD','GBP'].map(d=>`<option ${s.devise===d?'selected':''}>${d}</option>`).join('')}</select></div></div>
  <div class="field"><label>Email</label><input id="set_email" value="${esc(s.email||'')}"></div>
    <div class="field"><label>Commercial (nom sur les devis)</label><input id="set_commercial" value="${esc(s.commercial||'Iliass Najou')}"></div>

function saveSettings(){DB.settings.agence=val('set_agence');DB.settings.ville=val('set_ville');DB.settings.devise=val('set_devise');DB.settings.email=val('set_email');DB.settings.commercial=val('set_commercial');save();toast('Paramètres enregistrés');render();}

function modal(html){document.getElementById('modalRoot').innerHTML=`<div class="ov" onclick="if(event.target===this)closeModal()">${html}</div>`;}

function formShell(title,body,onsave,ondel,wide){return `<div class="modal ${wide||''}"><div class="mh"><h2>${title}</h2><div class="sp"></div><button class="x" onclick="closeModal()">×</button></div><div class="mb">${body}</div><div class="mf">${ondel?`<button class="btn danger" onclick="${ondel}">Supprimer</button>`:''}<div class="sp"></div><button class="btn" onclick="closeModal()">Annuler</button><button class="btn primary" onclick="${onsave}">Enregistrer</button></div></div>`;}

function recalcDevis(){

  let cout=0;window._sections.forEach((s,si)=>{let st=0;s.lines.forEach((l,li)=>{const t=lineTot(l);st+=t;const cell=document.getElementById(`lt-${si}-${li}`);if(cell)cell.textContent=l.statut==='Inclus'?money(t,dev):(l.statut==='Option'?'option':'—');});cout+=st;const sc=document.getElementById(`st-${si}`);if(sc)sc.textContent=money(st,dev);});

}

async function getDownloads(){for(let i=0;i<16;i++){if(window.claude&&claude.use){try{return await claude.use('downloads');}catch(e){return null;}}await new Promise(r=>setTimeout(r,150));}return null;}
async function exportDevisPDF(id){const d=devis(id);if(!(window.jspdf&&window.jspdf.jsPDF)){toast('PDF en cours de chargement…');return;}let blob;try{blob=buildDevisBlob(d);}catch(e){toast('Erreur PDF');return;}
  const name=(d.ref||'devis')+'_Trek_des_Gazelles.pdf';
  const dl=await getDownloads();
  if(dl){try{await dl.save({filename:name,data:blob});toast('PDF enregistré ✓');return;}catch(e){if(e&&e.code==='declined')return;}}
  const local=location.protocol==='file:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';
  if(local&&triggerDownload(blob,name)){toast('PDF téléchargé ✓ (dossier Téléchargements)');return;}
  openPdfOverlay(blob,name);}
function triggerDownload(blob,name){try{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){a.remove();URL.revokeObjectURL(url);},1500);return true;}catch(e){return false;}}
function openPdfOverlay(blob,name){try{const url=URL.createObjectURL(blob);const ov=document.createElement('div');ov.className='pdfov';const bar=document.createElement('div');bar.className='pdfbar';const sp=document.createElement('span');sp.textContent=name;const b=document.createElement('button');b.textContent='Fermer ✕';b.onclick=function(){ov.remove();URL.revokeObjectURL(url);};bar.appendChild(sp);bar.appendChild(b);const ifr=document.createElement('iframe');ifr.src=url;ov.appendChild(bar);ov.appendChild(ifr);document.body.appendChild(ov);toast('Aperçu PDF — enregistre-le depuis le lecteur');}catch(e){toast('Impossible d’ouvrir le PDF');}}

function showFacture(id){const f=DB.factures.find(x=>x.id===id),c=client(f.clientId),p=facPaye(f),st=facStatut(f),reste=f.montant-p,pct=f.montant?Math.min(100,Math.round(p/f.montant*100)):0;

    ${(f.paiements||[]).length?f.paiements.map((pm,i)=>`<div class="pay-row"><span class="num">${new Date(pm.date).toLocaleDateString('fr-FR')} · ${esc(pm.mode||'')}</span><span class="num">${money(pm.montant,f.devise)} <button class="btn ghost sm" onclick="delPay('${f.id}',${i})">×</button></span></div>`).join(''):`<div class="t-sub" style="padding:6px 0">Aucun paiement.</div>`}

function addPay(id){const f=DB.factures.find(x=>x.id===id);const m=+val('pay_m');if(!m)return;f.paiements=f.paiements||[];f.paiements.push({date:today(),montant:m,mode:val('pay_mode')});save();showFacture(id);render();toast('Paiement ajouté');}
function delPay(id,i){const f=DB.factures.find(x=>x.id===id);f.paiements.splice(i,1);save();showFacture(id);render();}

function opNuits(o){var a=new Date(o.dateDebut),b=new Date(o.dateFin);var n=Math.round((b-a)/864e5);return (n&&n>0)?n:3;}
function genOpSections(o){
  var P=+o.pax||1, C=+o.cout||0, nu=opNuits(o);
  var etr=o.type==='Étranger';
  var tmpl=etr?[
    ['Billets d’avion aller-retour',0.30,P,1,'vol international'],

    ['Transferts & transport local',0.12,Math.max(1,Math.ceil(P/15)),nu,'autocar/van'],
    ['Restauration (repas inclus)',0.10,P,nu,''],
    ['Excursions & visites guidées',0.12,P,1,''],
    ['Assistance & assurance voyage',0.08,P,1,'']

    ['Transport & transferts',0.15,Math.max(1,Math.ceil(P/15)),nu,'autocars / 4x4'],

    ['Logistique, eau & divers',0.07,P,1,'']

}
